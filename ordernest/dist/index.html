<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OrderNest — spokojne zamówienia</title><link rel="stylesheet" href="/style.css"><script src="/browser-runtime.js" defer></script></head>
<body>
<header class="top"><a class="brand" href="#"><span aria-hidden="true">◒</span> OrderNest</a><button id="language" class="text-button" type="button">English</button></header>
<main>
<section class="hero"><p class="eyebrow" data-t="eyebrow"></p><h1 data-t="title"></h1><p class="intro" data-t="intro"></p><p id="source" class="source" role="status"></p></section>
<section class="toolbar" aria-label="Controls"><div><label for="mode" data-t="modeLabel"></label><select id="mode"><option value="demo" data-t="demoMode"></option><option value="sandbox" data-t="sandboxMode" disabled></option></select><p class="small" id="connection"></p></div><div class="actions"><button id="review" type="button" data-t="review"></button><button id="ask" type="button" class="secondary" disabled data-t="ask"></button></div></section>
<p id="notice" class="notice" role="status" aria-live="polite"></p>
<section class="stats" aria-label="Summary"><button data-filter="all" class="stat" type="button"><span data-t="all"></span><strong id="count-all">6</strong></button><button data-filter="matched" class="stat" type="button"><span data-t="matched"></span><strong id="count-matched">—</strong></button><button data-filter="waiting" class="stat" type="button"><span data-t="waiting"></span><strong id="count-waiting">—</strong></button><button data-filter="review" class="stat" type="button"><span data-t="reviewStatus"></span><strong id="count-review">—</strong></button><button data-filter="unknown" class="stat" type="button"><span data-t="unknown"></span><strong id="count-unknown">—</strong></button></section>
<div class="workspace"><section class="card orders"><div class="section-head"><div><p class="eyebrow" data-t="today"></p><h2 data-t="orders"></h2></div><button id="reset" class="text-button" type="button" data-t="reset"></button></div><p class="small" data-t="editHint"></p><div id="rows" class="rows"></div><p id="empty" hidden data-t="empty"></p><details class="import"><summary data-t="importTitle"></summary>
<p class="small" data-t="manualHint"></p><div class="record-form"><label for="new-label" data-t="itemLabel"></label><input id="new-label" type="text" maxlength="80"><label for="new-paypal" data-t="orderId"></label><input id="new-paypal" type="text" maxlength="36" autocapitalize="characters" spellcheck="false"><div class="amount-pair"><div><label for="new-amount" data-t="expected"></label><input id="new-amount" type="text" inputmode="decimal" maxlength="12"></div><div><label for="new-currency" data-t="currencyLabel"></label><select id="new-currency"><option value="PLN">PLN</option><option value="EUR">EUR</option><option value="USD">USD</option></select></div></div><button id="add-record" type="button" class="secondary" data-t="addRecord"></button><button id="clear-records" type="button" class="text-button" data-t="clearRecords"></button></div>
<details class="advanced"><summary data-t="advanced"></summary><p class="small" data-t="importHint"></p><label for="record-json" data-t="recordsJson"></label><textarea id="record-json" rows="5" spellcheck="false"></textarea><button id="import" type="button" class="secondary" data-t="importButton"></button></details></details></section>
<aside class="card detail"><p class="eyebrow" data-t="perspective"></p><h2 id="detail-title" data-t="detailTitle"></h2><p id="detail-text"></p><dl id="facts"></dl><div class="divider"></div><h3 data-t="draftTitle"></h3><p class="small" data-t="draftHint"></p><button id="draft" class="secondary" type="button" disabled data-t="draft"></button><ul id="checklist"></ul><p id="trace" class="small"></p><div class="export-links"><a id="export-text" class="text-button" aria-disabled="true" data-t="exportText"></a><a id="export" class="text-button" aria-disabled="true" data-t="export"></a></div></aside></div>
<footer><p data-t="footer"></p><p class="small" data-t="privacy"></p></footer>
</main></body></html>
